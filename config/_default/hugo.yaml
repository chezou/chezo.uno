title: Democratizing Data
baseURL: https://chezo.uno/
copyright: "&copy; Aki Ariga 2017-{year}"

cascade:
  - share: true
    show_related: true
    reading_time: true
    show_date_updated: true
    pager: true
    target:
      path: /post/**
      kind: page
  - share: true
    show_related: true
    reading_time: true
    show_date_updated: true
    pager: true
    target:
      path: /blog/**
      kind: page
  # Per-page content language, read by layouts/baseof.html for <html lang>.
  # Named content_lang because Hugo reserves `lang` and rejects it in cascade.
  # The site is configured as a single Hugo language, so every page would
  # otherwise be labelled en-us. Chrome picks Han glyph shapes off this
  # attribute, and Japanese text tagged as English can be rendered with Chinese
  # forms for characters like 直, 令 and 骨. /post is the Japanese blog and
  # /blog the English one; a post that crosses the split sets content_lang in
  # its own front matter.
  # No kind filter here, so section list pages are covered too.
  - content_lang: ja
    target:
      path: "{/post,/post/**}"
  - content_lang: en
    target:
      path: "{/blog,/blog/**}"


ignoreLogs:
  - shortcode-x-getremote
build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
defaultContentLanguage: en
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: false
pagination.pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles:
  - \.ipynb$
  - .ipynb_checkpoints$
  - \.Rmd$
  - \.Rmarkdown$
  - _files$
  - _cache$
disableAliases: false
timeout: 600000
outputs:
  home:
    - HTML
    - RSS
    - headers
    - redirects
    - backlinks
  section:
    - HTML
    - RSS
mediaTypes:
  application/manifest+json:
    suffixes:
      - webmanifest
outputFormats:
  WebAppManifest:
    mediaType: application/manifest+json
    rel: manifest
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors
markup:
  _merge: deep
permalinks:
  authors: /author/:slug/
  tags: /tags/:slug/
  categories: /categories/:slug/
  publication_types: /publication-type/:slug/
params:
  mainSections:
    - post
    - blog
security:
  _merge: deep
sitemap:
  _merge: deep
minify:
  _merge: deep
